spring.application.name=bairro

# O Render define a porta em PORT; localmente cai no 8080.
server.port=${PORT:8080}
# Atras do proxy do Render (HTTPS termina la), usa X-Forwarded-* para montar URLs como o Location.
server.forward-headers-strategy=framework

spring.datasource.url=jdbc:postgresql://localhost:5432/bairro
spring.datasource.username=bairro
spring.datasource.password=bairro123
spring.jpa.hibernate.ddl-auto=update
